<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mazer: a mobile-clean maze game built for browser and installable PWA play." />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mazer" />
    <meta property="og:description" content="Mazer: a mobile-clean maze game built for browser and installable PWA play." />
    <meta property="og:url" content="https://mazer.fawxzzy.com/" />
    <meta property="og:image" content="https://mazer.fawxzzy.com/icons/mazer-app-icon.png?v=mazer-final-icon-v2" />
    <meta property="og:image:secure_url" content="https://mazer.fawxzzy.com/icons/mazer-app-icon.png?v=mazer-final-icon-v2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Mazer app icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mazer" />
    <meta name="twitter:description" content="Mazer: a mobile-clean maze game built for browser and installable PWA play." />
    <meta name="twitter:image" content="https://mazer.fawxzzy.com/icons/mazer-app-icon.png?v=mazer-final-icon-v2" />
    <meta name="twitter:image:alt" content="Mazer app icon" />
    <meta name="theme-color" content="#02080f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mazer" />
    <!-- iOS home-screen PWAs misplace bottom-anchored UI when black-translucent
         is combined with viewport-fit=cover (confirmed root cause ported from
         the Fitness app, which hit and fixed the exact same bug) -- default
         keeps the status bar from throwing off bottom safe-area positioning. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico?v=mazer-final-icon-v2" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png?v=mazer-final-icon-v2" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icons/icon-512.png?v=mazer-final-icon-v2" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=mazer-final-icon-v2" />
    <link rel="canonical" href="https://mazer.fawxzzy.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/space-grotesk/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Mazer</title>
    <!-- Static boot splash: paints before any script or the CSS bundle loads so
         the page is never blank. Removed explicitly by src/boot/bootSplash.ts
         (driven by bootStatus). Colors mirror the install gate / theme-color. -->
    <style>
      html, body { background: #02080f; margin: 0; }
      #mazer-boot-splash {
        position: fixed; inset: 0; z-index: 1;
        display: grid; place-content: center; justify-items: center; gap: 22px;
        background: #02080f; color: #d7fff8;
        font-family: "Segoe UI Variable", "Helvetica Neue", Arial, sans-serif;
      }
      #mazer-boot-splash .mazer-boot-splash-brand {
        color: #3ddbd4; font-size: 14px; font-weight: 500; letter-spacing: 0.32em; margin-right: -0.32em;
      }
      #mazer-boot-splash .mazer-boot-splash-pulse {
        width: 10px; height: 10px; border-radius: 50%; background: #3ddbd4;
        animation: mazer-boot-splash-pulse 1.4s ease-in-out infinite;
      }
      #mazer-boot-splash .mazer-boot-splash-text { margin: 0; font-size: 14px; color: #a4beb8; }
      @keyframes mazer-boot-splash-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #mazer-boot-splash .mazer-boot-splash-pulse { animation: none; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="mazer-boot-splash" role="status" aria-live="polite">
        <strong class="mazer-boot-splash-brand">MAZER</strong>
        <span class="mazer-boot-splash-pulse" aria-hidden="true"></span>
        <p id="mazer-boot-splash-text" class="mazer-boot-splash-text">Loading&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/boot/main.ts"></script>
  </body>
</html>
