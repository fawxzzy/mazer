    <!-- Static boot splash: paints before any script or the CSS bundle loads so
         the page is never blank. Removed explicitly by src/boot/bootSplash.ts
         (driven by bootStatus). Colors mirror the install gate / theme-color. -->
    <style>
      html, body { background: #02080f; margin: 0; }
      /* The root is opaque from the first paint (same colour as the page, so nothing flashes); only the STAGE
         (icon, ring, label) fades in, after 150 ms, so a load that finishes inside that window never shows the loader.
         The root's own opacity is left to src/boot/bootSplash.ts, which fades it out (crossfade into the first real
         frame) after the stage has been up for its minimum hold. Timings mirror src/render/appLoader.ts
         (LOADER_SHOW_DELAY_MS, LOADER_FADE_IN_MS, LOADER_PULSE_PERIOD_MS = MOTION_LOOP_MS.beat); pinned by tests. */
      #mazer-boot-splash {
        position: fixed; inset: 0; z-index: 1;
        display: grid; place-content: center;
        background: #02080f; color: #d7fff8;
        font-family: "Segoe UI Variable", "Helvetica Neue", Arial, sans-serif;
        /* 30% of the short side, 88..150 px: the same size and place as the iOS launch image and the in-game loader. */
        --mazer-loader-icon: clamp(88px, min(30vw, 30vh), 150px);
      }
      #mazer-boot-splash .mazer-boot-splash-stage {
        position: relative; width: var(--mazer-loader-icon); height: var(--mazer-loader-icon);
        opacity: 0;
        animation: mazer-boot-splash-in 200ms ease 150ms both;
      }
      /* A static soft glow behind the icon (never animated, so no repaint per frame). */
      #mazer-boot-splash .mazer-boot-splash-stage::before {
        content: ""; position: absolute; inset: -70%;
        background: radial-gradient(circle, rgba(61, 219, 212, 0.16), rgba(61, 219, 212, 0) 62%);
      }
      /* Size is reserved by width/height on the element and here, and the image is an inline data URI (no request). */
      #mazer-boot-splash .mazer-boot-splash-icon {
        position: relative; display: block; width: 100%; height: 100%; border-radius: 20%;
        will-change: transform;
        /* One beat (MOTION_LOOP_MS.beat = 1200 ms), the same period as the in-game loader; pinned by tests. */
        animation: mazer-boot-splash-breathe 1.2s ease-in-out infinite;
      }
      #mazer-boot-splash .mazer-boot-splash-ring {
        position: absolute; inset: 0; box-sizing: border-box; border-radius: 22%;
        border: 2px solid #3ddbd4; opacity: 0; will-change: transform, opacity;
        animation: mazer-boot-splash-ring 1.2s ease-out infinite;
      }
      /* Under the icon, out of flow: the label changing never moves the icon. */
      #mazer-boot-splash .mazer-boot-splash-text {
        position: absolute; top: calc(100% + 22px); left: 50%; transform: translateX(-50%);
        margin: 0; white-space: nowrap; font-size: 14px; color: #a4beb8;
      }
      @keyframes mazer-boot-splash-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes mazer-boot-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes mazer-boot-splash-ring {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.22); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Movement and pulsing stop: the icon holds still, the ring is a still halo. The fade-in is already the 200 ms crossfade. */
        #mazer-boot-splash .mazer-boot-splash-icon { animation: none; }
        #mazer-boot-splash .mazer-boot-splash-ring { animation: none; transform: scale(1.08); opacity: 0.28; }
      }
    </style>
