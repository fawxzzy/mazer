<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mazer: a mobile-clean maze game built for browser and installable PWA play." />
    <meta property="og:url" content="https://mazer.fawxzzy.com/" />
    <meta name="theme-color" content="#02080f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mazer" />
    <!-- iOS home-screen PWAs misplace bottom-anchored UI when black-translucent
         is combined with viewport-fit=cover (confirmed root cause ported from
         the Fitness app, which hit and fixed the exact same bug) -- default
         keeps the status bar from throwing off bottom safe-area positioning. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/mazer-app-icon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icons/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="canonical" href="https://mazer.fawxzzy.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mazer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot/main.ts"></script>
  </body>
</html>
