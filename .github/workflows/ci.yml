name: Owner export

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "config/mazer-owner-work-registry.json"
      - "docs/current-truth.md"
      - "docs/roadmap.md"
      - "docs/mobile-plan.md"
      - "exports/mazer.project-board.owner-export.v1.json"
      - "package.json"
      - "scripts/export-project-board-owner.mjs"
      - "tests/project-board-owner-export.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "config/mazer-owner-work-registry.json"
      - "docs/current-truth.md"
      - "docs/roadmap.md"
      - "docs/mobile-plan.md"
      - "exports/mazer.project-board.owner-export.v1.json"
      - "package.json"
      - "scripts/export-project-board-owner.mjs"
      - "tests/project-board-owner-export.test.mjs"

permissions:
  contents: read

jobs:
  owner-export:
    name: Deterministic public owner export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify owner export
        run: npm run test:project-board-owner-export
      - name: Verify generated bytes are current
        run: npm run project-board:owner-export:check
