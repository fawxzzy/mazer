name: Owner export

on:
  # Also dispatchable so the scheduled board-sync job (opened with the workflow token, which does not trigger pull_request
  # runs) can start the same checks on its branch.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/board-sync.yml"
      - "config/mazer-owner-work-registry.json"
      - "config/mazer-work-ledger.json"
      - "config/mazer-board-events.jsonl"
      - "docs/ops/MAZER-WORK-REPORT.md"
      - "docs/ops/MAZER-WORK-REPORT.json"
      - "scripts/analysis/work-report.mjs"
      - "scripts/board/**"
      - "tests/board-sync.test.mjs"
      - "docs/current-truth.md"
      - "docs/roadmap.md"
      - "docs/mobile-plan.md"
      - "exports/mazer.project-board.owner-export.v1.json"
      - "package.json"
      - "scripts/export-project-board-owner.mjs"
      - "tests/project-board-owner-export.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/board-sync.yml"
      - "config/mazer-owner-work-registry.json"
      - "config/mazer-work-ledger.json"
      - "config/mazer-board-events.jsonl"
      - "docs/ops/MAZER-WORK-REPORT.md"
      - "docs/ops/MAZER-WORK-REPORT.json"
      - "scripts/analysis/work-report.mjs"
      - "scripts/board/**"
      - "tests/board-sync.test.mjs"
      - "docs/current-truth.md"
      - "docs/roadmap.md"
      - "docs/mobile-plan.md"
      - "exports/mazer.project-board.owner-export.v1.json"
      - "package.json"
      - "scripts/export-project-board-owner.mjs"
      - "tests/project-board-owner-export.test.mjs"

permissions:
  contents: read

jobs:
  owner-export:
    name: Deterministic public owner export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify owner export
        run: npm run test:project-board-owner-export
      - name: Verify generated bytes are current
        run: npm run project-board:owner-export:check
      # The work report and the board-sync inputs are pure functions of the registry, ledger and event archive, so they are
      # checked here, where those inputs trigger the workflow, and not in the Verify workflow, which skips board-only changes.
      - name: Verify the generated work report is current
        run: node ./scripts/analysis/work-report.mjs --check
      - name: Verify board sync integrity and tests
        run: |
          node ./scripts/board/board-sync.mjs check
          node --test tests/board-sync.test.mjs
