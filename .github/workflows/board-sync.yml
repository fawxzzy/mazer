name: Board sync

# Folds pending board events into the registry, ledger, export and work report and opens ONE pull request.
# No LLM and no secrets: it uses the workflow token only. It never builds, deploys or moves an alias.
# Runs on demand (Actions tab or `gh workflow run board-sync.yml`) and, only when the repository variable
# MAZER_BOARD_SYNC_SCHEDULE is set to "on", weekly. Policy and rollback: docs/ops/MAZER-BOARD-SYNC-PROCESS.md.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Open the pull request even when the trigger policy says a sync is not due"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fold board events into one pull request
    if: github.event_name == 'workflow_dispatch' || vars.MAZER_BOARD_SYNC_SCHEDULE == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FORCE: ${{ inputs.force }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Decide whether a sync is due
        id: due
        run: |
          node scripts/board/board-sync.mjs status | tee "$RUNNER_TEMP/status.txt"
          if [ "$FORCE" = "true" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if node scripts/board/board-sync.mjs status --due > /dev/null; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi
      - name: Dry-run diff
        if: steps.due.outputs.due == 'true'
        run: node scripts/board/board-sync.mjs plan | tee "$RUNNER_TEMP/plan.txt"
      - name: Apply
        if: steps.due.outputs.due == 'true'
        run: node scripts/board/board-sync.mjs apply
      - name: Verify the generated files
        if: steps.due.outputs.due == 'true'
        run: |
          node scripts/board/board-sync.mjs check
          node scripts/export-project-board-owner.mjs --check
          node scripts/analysis/work-report.mjs --check
          node --test tests/board-sync.test.mjs
      - name: Open the pull request and start its checks
        if: steps.due.outputs.due == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing to sync."; exit 0; fi
          branch="board-sync/$(date -u +%Y%m%d-%H%M)"
          git config user.name "mazer-board-sync"
          git config user.email "board-sync@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/mazer-owner-work-registry.json config/mazer-work-ledger.json config/mazer-board-events.jsonl exports/mazer.project-board.owner-export.v1.json docs/ops/MAZER-WORK-REPORT.md docs/ops/MAZER-WORK-REPORT.json
          git commit -m "Board sync: fold pending board events"
          git push origin "$branch"
          {
            echo "Folds pending board events into the registry, ledger, owner export and work report. Generated by scripts/board/board-sync.mjs (no LLM)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo
            echo "Status before sync: $(head -n 1 "$RUNNER_TEMP/status.txt")"
            echo
            echo "Merge only when the Owner export check passes on the exact head. After merge: FawxzzyWeb re-pin (board-sync web), then an unaliased build; alias moves stay with the owner."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Board sync: fold pending board events" --body-file "$RUNNER_TEMP/body.md"
          # Pull requests opened with the workflow token do not start pull_request workflows; dispatch the checks explicitly.
          gh workflow run ci.yml --ref "$branch"
